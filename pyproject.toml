[project]
name = "whosingsthat"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "mutagen>=1.48.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"who_sings_that.database.migrations" = ["script.py.mako"]
"who_sings_that.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
